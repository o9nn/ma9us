name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: framework/go.mod

      - name: Build
        working-directory: framework
        run: go build ./...

      - name: Test
        working-directory: framework
        run: go test -v -count=1 ./...
